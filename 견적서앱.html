<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적서 작성 — 아아</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;
  --blue-400:#60a5fa;--blue-500:#3b82f6;--blue-600:#2563eb;
  --blue-700:#1d4ed8;--blue-800:#1e40af;--blue-900:#1e3a8a;
  --panel-bg:#0f172a;--card-bg:#1e293b;--card-border:#334155;
  --input-bg:#0f172a;--text-main:#e2e8f0;--text-muted:#64748b;
}
body { font-family:'Pretendard',sans-serif; background:var(--panel-bg); min-height:100vh; display:flex; flex-direction:column; color:var(--text-main); }

/* TOPBAR */
.topbar { height:56px; background:rgba(15,23,42,.96); backdrop-filter:blur(12px); border-bottom:1px solid #1e293b; display:flex; align-items:center; justify-content:space-between; padding:0 20px; position:sticky; top:0; z-index:200; }
.tb-brand { display:flex; align-items:center; gap:10px; }
.tb-logo { width:32px; height:32px; background:linear-gradient(135deg,var(--blue-500),var(--blue-700)); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; letter-spacing:-1px; }
.tb-title { font-size:14px; font-weight:600; color:#f1f5f9; letter-spacing:-.3px; }
.tb-title small { font-size:11px; color:var(--text-muted); font-weight:400; margin-left:6px; }
.tb-actions { display:flex; gap:8px; }
.btn { font-family:'Pretendard',sans-serif; font-size:13px; font-weight:600; padding:8px 18px; border-radius:10px; border:none; cursor:pointer; transition:all .18s cubic-bezier(.4,0,.2,1); letter-spacing:-.2px; }
.btn-primary { background:linear-gradient(135deg,var(--blue-500),var(--blue-600)); color:#fff; box-shadow:0 2px 12px rgba(59,130,246,.35); }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(59,130,246,.45); }
.btn-ghost { background:#1e293b; color:#94a3b8; border:1px solid #334155; }
.btn-ghost:hover { background:#263445; color:#cbd5e1; }
.btn-sm { padding:6px 13px; font-size:12px; border-radius:8px; }

/* LAYOUT */
.workspace { flex:1; display:grid; grid-template-columns:380px 1fr; height:calc(100vh - 56px); overflow:hidden; }

/* EDITOR */
.editor { background:var(--panel-bg); border-right:1px solid #1e293b; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:13px; }
.editor::-webkit-scrollbar { width:3px; }
.editor::-webkit-scrollbar-thumb { background:#334155; border-radius:2px; }

.sc { background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; overflow:hidden; }
.sc-head { padding:11px 14px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--card-border); }
.sc-icon { width:22px; height:22px; background:linear-gradient(135deg,var(--blue-600),var(--blue-700)); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; }
.sc-label { font-size:12px; font-weight:700; color:#cbd5e1; flex:1; }
.sc-body { padding:14px; display:flex; flex-direction:column; gap:10px; }

.field label { display:block; font-size:10.5px; font-weight:600; color:var(--text-muted); margin-bottom:5px; }
input[type="text"],input[type="number"],input[type="date"],textarea {
  width:100%; background:var(--input-bg); border:1.5px solid #334155;
  border-radius:8px; color:var(--text-main); font-family:'Pretendard',sans-serif;
  font-size:13px; padding:8px 11px; outline:none; transition:border-color .15s, box-shadow .15s;
}
input:focus,textarea:focus { border-color:var(--blue-500); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
textarea { resize:vertical; min-height:86px; line-height:1.65; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* 프리셋 토글 */
.preset-toggle-btn {
  width:100%; background:linear-gradient(135deg,#1a2f52,#1e3a8a44);
  border:1.5px solid #2563eb33; border-radius:12px; padding:11px 14px;
  display:flex; align-items:center; gap:10px; cursor:pointer; transition:all .18s;
  color:#93c5fd; font-family:'Pretendard',sans-serif; text-align:left;
}
.preset-toggle-btn:hover { border-color:var(--blue-500); background:linear-gradient(135deg,#1e3462,#1e40af33); box-shadow:0 0 0 3px rgba(59,130,246,.1); }
.pt-icon { width:28px; height:28px; background:rgba(59,130,246,.18); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.pt-text { flex:1; }
.pt-label { font-size:12px; font-weight:700; display:block; color:#e2e8f0; }
.pt-sub { font-size:10px; color:var(--blue-400); opacity:.85; }
.pt-arrow { font-size:10px; color:var(--blue-400); transition:transform .22s; }
.preset-toggle-btn.open .pt-arrow { transform:rotate(180deg); }

.preset-panel { display:none; flex-direction:column; gap:7px; background:#0d1a30; border:1.5px solid #1e3a8a44; border-radius:12px; padding:11px; }
.preset-panel.open { display:flex; }

.preset-item {
  display:flex; align-items:center; gap:10px;
  background:#0f2248; border:1px solid #1e3a8a44; border-radius:9px;
  padding:10px 12px; cursor:pointer; transition:all .15s;
}
.preset-item:hover { background:#1e3a8a22; border-color:var(--blue-500); transform:translateX(3px); }
.pi-name { flex:1; font-size:13px; font-weight:600; color:#e2e8f0; }
.pi-price { font-size:12px; color:var(--blue-400); font-weight:700; }
.pi-add { width:26px; height:26px; background:var(--blue-600); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; font-weight:300; flex-shrink:0; line-height:1; }
.preset-item:hover .pi-add { background:var(--blue-500); }

/* 품목 카드 */
.items-list { display:flex; flex-direction:column; gap:9px; }
.item-card { background:#0f172a; border:1.5px solid #334155; border-radius:12px; padding:12px; position:relative; transition:border-color .15s; }
.item-card:hover { border-color:var(--blue-500); }
.item-num { font-size:9.5px; font-weight:800; color:var(--blue-400); letter-spacing:.5px; margin-bottom:9px; display:flex; align-items:center; gap:6px; }
.item-num::after { content:''; flex:1; height:1px; background:#1e293b; }
.remove-btn { position:absolute; top:10px; right:10px; background:#1e293b; border:1px solid #334155; border-radius:6px; color:#64748b; width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; line-height:1; transition:all .15s; }
.remove-btn:hover { background:#7f1d1d22; border-color:#f87171; color:#f87171; }
.item-row { display:grid; grid-template-columns:2fr 1fr 1fr; gap:6px; margin-bottom:6px; }
.item-row2 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.add-item-btn { background:transparent; border:1.5px dashed #334155; border-radius:10px; padding:10px; width:100%; color:#475569; font-family:'Pretendard',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:all .18s; display:flex; align-items:center; justify-content:center; gap:6px; }
.add-item-btn:hover { border-color:var(--blue-500); color:var(--blue-400); background:rgba(59,130,246,.05); }

/* PREVIEW */
.preview-wrap { background:#dde3ec; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:28px 24px; }

/* A4 */
.a4 {
  width:210mm; min-height:297mm; background:#fff;
  box-shadow:0 8px 40px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.1);
  padding:13mm 15mm 12mm 15mm;
  font-family:'Pretendard',sans-serif; font-size:9.5pt; color:#1a1a1a;
  border-radius:4px;
}

/* 견적서 내부 */
.q-no-line { font-size:8pt; color:#666; margin-bottom:1.5mm; }
.q-no-line span { display:inline-block; min-width:28mm; border-bottom:1px solid #999; padding-bottom:1px; margin-left:3px; font-weight:600; color:#111; }
.q-title { font-size:26pt; font-weight:800; letter-spacing:10px; color:#0f172a; line-height:1; margin-bottom:1.5mm; }
.q-title-bar { height:3px; background:linear-gradient(90deg,#2563eb,#93c5fd 60%,transparent); border-radius:2px; margin-bottom:5mm; }
.q-info-row { display:flex; justify-content:space-between; align-items:flex-start; gap:5mm; margin-bottom:4mm; }
.q-recipient-block { font-size:9pt; line-height:2; }
.q-date-line { color:#444; }
.q-to { font-size:12pt; font-weight:700; color:#0f172a; margin-bottom:1mm; }
.q-to span { border-bottom:2px solid #2563eb; padding-bottom:1px; }
.q-phrase { font-size:8.5pt; color:#555; }

/* 을 박스 */
.q-supplier-box { border:1.5px solid #cbd5e1; border-radius:9px; overflow:hidden; min-width:82mm; font-size:8pt; }
.q-supplier-header { background:linear-gradient(90deg,#1e40af,#2563eb); color:#fff; font-size:8pt; font-weight:700; padding:4px 10px; letter-spacing:1px; }
.q-supplier-table { width:100%; border-collapse:collapse; }
.q-supplier-table td { padding:3px 8px; border-bottom:1px solid #e5e7eb; vertical-align:middle; }
.q-supplier-table tr:last-child td { border-bottom:none; }
.q-supplier-table td.lbl { width:17mm; font-weight:700; color:#374151; background:#f8fafc; border-right:1px solid #e5e7eb; font-size:7.5pt; }
.q-supplier-table td.val { color:#1a1a1a; font-weight:500; }
.q-supplier-table td.val strong { font-weight:700; color:#0f172a; }
.seal { display:inline-flex; align-items:center; justify-content:center; width:16mm; height:16mm; border:1.8px solid #dc2626; border-radius:50%; color:#dc2626; font-size:6.5pt; font-weight:700; text-align:center; line-height:1.3; }

/* 갑 박스 */
.q-gap-box { border:1.5px solid #bfdbfe; border-radius:9px; overflow:hidden; margin-bottom:4mm; font-size:8pt; }
.q-gap-header { background:linear-gradient(90deg,#dbeafe,#eff6ff); color:#1e40af; font-size:8pt; font-weight:700; padding:4px 10px; border-bottom:1px solid #bfdbfe; }
.q-gap-table { width:100%; border-collapse:collapse; }
.q-gap-table td { padding:3px 8px; border-bottom:1px solid #dbeafe; vertical-align:middle; }
.q-gap-table tr:last-child td { border-bottom:none; }
.q-gap-table td.lbl { width:17mm; font-weight:700; color:#1e40af; font-size:7.5pt; background:#eff6ff; border-right:1px solid #bfdbfe; }

/* 합계 */
.q-total-bar { display:flex; align-items:stretch; border:1.5px solid #2563eb; border-radius:10px; overflow:hidden; margin-bottom:4mm; }
.q-total-lbl { background:linear-gradient(135deg,#1e40af,#2563eb); color:#fff; font-size:9pt; font-weight:700; padding:7px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:30mm; text-align:center; line-height:1.4; white-space:nowrap; }
.q-total-lbl small { font-size:6.5pt; font-weight:400; opacity:.85; }
.q-total-val { flex:1; background:#eff6ff; display:flex; align-items:center; padding:0 14px; font-size:13pt; font-weight:800; color:#1e3a8a; letter-spacing:-.5px; }

/* 품목 테이블 */
.q-table { width:100%; border-collapse:collapse; font-size:8pt; margin-bottom:4mm; border:1.5px solid #94a3b8; border-radius:8px; overflow:hidden; }
.q-table thead tr { background:linear-gradient(90deg,#1e40af,#2563eb); }
.q-table thead th { color:#fff; font-size:7.5pt; font-weight:700; padding:5px 4px; text-align:center; border-right:1px solid rgba(255,255,255,.2); }
.q-table thead th:last-child { border-right:none; }
.q-table tbody tr { border-bottom:1px solid #e2e8f0; }
.q-table tbody tr:nth-child(even) { background:#f8fafc; }
.q-table tbody td { padding:3.5px 4px; text-align:center; border-right:1px solid #e2e8f0; vertical-align:middle; }
.q-table tbody td:last-child { border-right:none; }
.q-table tbody td.td-left { text-align:left; padding-left:7px; }
.q-table tr.sum-row td { background:linear-gradient(90deg,#eff6ff,#dbeafe); font-weight:800; color:#1e40af; border-top:1.5px solid #2563eb; padding:5px 4px; }

/* 비고 */
.q-note-section { border:1.5px solid #cbd5e1; border-radius:9px; overflow:hidden; margin-bottom:5mm; }
.q-note-head { background:#f1f5f9; border-bottom:1px solid #cbd5e1; padding:4px 10px; font-size:8pt; font-weight:700; color:#374151; }
.q-note-body { min-height:16mm; padding:6px 10px; font-size:8pt; color:#374151; line-height:1.75; white-space:pre-wrap; }

/* 서명란 */
.q-footer { display:flex; justify-content:flex-end; gap:8mm; }
.q-sign-box { text-align:center; font-size:8pt; color:#555; }
.sign-label { margin-bottom:2mm; font-weight:600; }
.sign-line { width:28mm; height:10mm; border-bottom:1.5px solid #999; display:flex; align-items:flex-end; justify-content:center; padding-bottom:2px; color:#999; font-size:7pt; }

/* PRINT */
@media print {
  *,-webkit-print-color-adjust:exact!important;
  print-color-adjust:exact!important;
  html,body { background:white!important; height:auto!important; }
  .topbar,.editor { display:none!important; }
  .workspace { display:block!important; height:auto!important; }
  .preview-wrap { display:block!important; background:white!important; padding:0!important; overflow:visible!important; }
  .a4 { box-shadow:none!important; border-radius:0!important; width:100%!important; min-height:auto!important; padding:12mm 14mm!important; }
  .q-title-bar { -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
  .q-supplier-header,.q-total-lbl,.q-table thead tr { -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
  .q-table tbody tr:nth-child(even) { background:#f8fafc!important; }
  .q-table tr.sum-row td { background:#dbeafe!important; }
  .q-total-val { background:#eff6ff!important; }
  .q-gap-header { background:#dbeafe!important; }
  @page { size:A4 portrait; margin:0; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-brand">
    <div class="tb-logo">아아</div>
    <div class="tb-title">견적서 작성 <small>by 아아</small></div>
  </div>
  <div class="tb-actions">
    <button class="btn btn-ghost btn-sm" onclick="resetForm()">↺ 초기화</button>
    <button class="btn btn-primary" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
  </div>
</div>

<div class="workspace">

  <div class="editor">

    <div class="sc">
      <div class="sc-head"><div class="sc-icon">📋</div><span class="sc-label">기본 정보</span></div>
      <div class="sc-body">
        <div class="row2">
          <div class="field"><label>견적서 No.</label><input type="text" id="quoteNo" placeholder="2025-001" oninput="render()"></div>
          <div class="field"><label>발행일</label><input type="date" id="quoteDate" oninput="render()"></div>
        </div>
      </div>
    </div>

    <div class="sc">
      <div class="sc-head"><div class="sc-icon">🏢</div><span class="sc-label">갑 — 발주처 정보</span></div>
      <div class="sc-body">
        <div class="field"><label>수신 (귀하)</label><input type="text" id="clientName" placeholder="홍길동 / (주)○○○" oninput="render()"></div>
        <div class="field"><label>상 호</label><input type="text" id="clientCompany" placeholder="회사명" oninput="render()"></div>
        <div class="field"><label>주 소</label><input type="text" id="clientAddr" placeholder="주소" oninput="render()"></div>
        <div class="row2">
          <div class="field"><label>대 표</label><input type="text" id="clientCeo" placeholder="대표자명" oninput="render()"></div>
          <div class="field"><label>사업자번호</label><input type="text" id="clientBizNo" placeholder="000-00-00000" oninput="render()"></div>
        </div>
      </div>
    </div>

    <!-- 프리셋 -->
    <div class="sc">
      <div class="sc-head"><div class="sc-icon">⚡</div><span class="sc-label">자주 쓰는 품목</span></div>
      <div class="sc-body">
        <button class="preset-toggle-btn" id="presetToggleBtn" onclick="togglePreset()">
          <div class="pt-icon">📦</div>
          <div class="pt-text">
            <span class="pt-label">빠른 품목 추가</span>
            <span class="pt-sub">칠판 · 지우개 · 마우스</span>
          </div>
          <span class="pt-arrow">▼</span>
        </button>
        <div class="preset-panel" id="presetPanel">
          <div class="preset-item" onclick="addPreset('칠판', 1000)">
            <span class="pi-name">🟫 칠판</span>
            <span class="pi-price">₩ 1,000</span>
            <div class="pi-add">+</div>
          </div>
          <div class="preset-item" onclick="addPreset('지우개', 2000)">
            <span class="pi-name">⬜ 지우개</span>
            <span class="pi-price">₩ 2,000</span>
            <div class="pi-add">+</div>
          </div>
          <div class="preset-item" onclick="addPreset('마우스', 3000)">
            <span class="pi-name">🖱 마우스</span>
            <span class="pi-price">₩ 3,000</span>
            <div class="pi-add">+</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 품목 -->
    <div class="sc">
      <div class="sc-head"><div class="sc-icon">📝</div><span class="sc-label">품목 목록</span><span style="font-size:10px;color:var(--text-muted)" id="itemCount"></span></div>
      <div class="sc-body">
        <div class="items-list" id="itemsList"></div>
        <button class="add-item-btn" onclick="addItem()"><span style="font-size:16px;line-height:1">+</span> 빈 품목 추가</button>
      </div>
    </div>

    <!-- 안내사항 -->
    <div class="sc">
      <div class="sc-head"><div class="sc-icon">💬</div><span class="sc-label">안내사항 / 비고</span></div>
      <div class="sc-body">
        <div class="field">
          <label>견적서 하단 안내문 (자유 수정)</label>
          <textarea id="noteText" rows="5" oninput="render()" placeholder="예시:&#10;· 본 견적서는 발행일로부터 30일간 유효합니다.&#10;· 세금계산서 발행 가능합니다.&#10;· 문의: 010-0000-0000"></textarea>
        </div>
      </div>
    </div>

  </div>

  <div class="preview-wrap">
    <div class="a4" id="a4Preview"></div>
  </div>

</div>

<script>
const SUP = { company:'아아', addr:'2076호(영천동)', ceo:'김미미', bizNo:'000' };
let items = [{ name:'', spec:'', qty:1, price:0, taxRate:10, note:'' }];

function togglePreset() {
  document.getElementById('presetToggleBtn').classList.toggle('open');
  document.getElementById('presetPanel').classList.toggle('open');
}

function addPreset(name, price) {
  const empty = items.findIndex(it => !it.name && !it.price);
  if (empty !== -1) { items[empty].name = name; items[empty].price = price; }
  else items.push({ name, spec:'', qty:1, price, taxRate:10, note:'' });
  renderEditor(); render();
}

function addItem() {
  items.push({ name:'', spec:'', qty:1, price:0, taxRate:10, note:'' });
  renderEditor(); render();
}

function removeItem(idx) {
  if (items.length === 1) { items[0] = { name:'', spec:'', qty:1, price:0, taxRate:10, note:'' }; }
  else items.splice(idx, 1);
  renderEditor(); render();
}

function renderEditor() {
  document.getElementById('itemCount').textContent = items.length + '개';
  document.getElementById('itemsList').innerHTML = items.map((it, i) => `
    <div class="item-card">
      <div class="item-num">ITEM ${String(i+1).padStart(2,'0')}</div>
      <button class="remove-btn" onclick="removeItem(${i})">×</button>
      <div class="item-row">
        <div class="field"><label>품목명</label><input type="text" value="${esc(it.name)}" placeholder="품목명" oninput="items[${i}].name=this.value;render()"></div>
        <div class="field"><label>규격</label><input type="text" value="${esc(it.spec)}" placeholder="-" oninput="items[${i}].spec=this.value;render()"></div>
        <div class="field"><label>수량</label><input type="number" value="${it.qty}" min="0" oninput="items[${i}].qty=parseFloat(this.value)||0;render()"></div>
      </div>
      <div class="item-row2">
        <div class="field"><label>단가 (원)</label><input type="number" value="${it.price}" min="0" step="100" oninput="items[${i}].price=parseFloat(this.value)||0;render()"></div>
        <div class="field"><label>세율 (%)</label><input type="number" value="${it.taxRate}" min="0" max="100" oninput="items[${i}].taxRate=parseFloat(this.value)||0;render()"></div>
        <div class="field"><label>비고</label><input type="text" value="${esc(it.note)}" placeholder="-" oninput="items[${i}].note=this.value;render()"></div>
      </div>
    </div>`).join('');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }

function render() {
  const quoteNo   = document.getElementById('quoteNo').value||'';
  const quoteDate = document.getElementById('quoteDate').value||'';
  const cName     = document.getElementById('clientName').value||'';
  const cCo       = document.getElementById('clientCompany').value||'';
  const cAddr     = document.getElementById('clientAddr').value||'';
  const cCeo      = document.getElementById('clientCeo').value||'';
  const cBiz      = document.getElementById('clientBizNo').value||'';
  const note      = document.getElementById('noteText').value||'';

  let dateStr = '20__ 년 &nbsp; 월 &nbsp; 일';
  if (quoteDate) { const [y,m,d]=quoteDate.split('-'); dateStr=`${y}년 ${+m}월 ${+d}일`; }

  let totSupply=0, totTax=0;
  const rows = items.map(it => {
    const supply = it.qty * it.price;
    const tax = Math.round(supply * it.taxRate / 100);
    totSupply += supply; totTax += tax;
    return {...it, supply, tax};
  });
  const grand = totSupply + totTax;
  const empty = Math.max(0, 14 - rows.length);

  document.getElementById('a4Preview').innerHTML = `
    <div class="q-no-line">No. <span>${quoteNo}</span></div>
    <div class="q-title">견&nbsp;&nbsp;적&nbsp;&nbsp;서</div>
    <div class="q-title-bar"></div>

    <div class="q-info-row">
      <div class="q-recipient-block">
        <div class="q-date-line">${dateStr}</div>
        <div class="q-to"><span>${cName||'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'} 귀하</span></div>
        <div class="q-phrase">아래와 같이 견적 합니다.</div>
      </div>
      <div class="q-supplier-box">
        <div class="q-supplier-header">공 급 자 (을)</div>
        <table class="q-supplier-table">
          <tr>
            <td class="lbl">상&nbsp;&nbsp;&nbsp;호</td>
            <td class="val"><strong>${SUP.company}</strong></td>
            <td rowspan="2" style="text-align:center;width:18mm;vertical-align:middle"><div class="seal">대표<br>인</div></td>
          </tr>
          <tr>
            <td class="lbl">대&nbsp;&nbsp;&nbsp;표</td>
            <td class="val">${SUP.ceo} (인)</td>
          </tr>
          <tr><td class="lbl">사업자번호</td><td class="val" colspan="2">${SUP.bizNo}</td></tr>
          <tr><td class="lbl">주&nbsp;&nbsp;&nbsp;소</td><td class="val" colspan="2">${SUP.addr}</td></tr>
        </table>
      </div>
    </div>

    ${(cCo||cAddr||cCeo||cBiz)?`
    <div class="q-gap-box">
      <div class="q-gap-header">발 주 처 (갑)</div>
      <table class="q-gap-table">
        <tr><td class="lbl">상&nbsp;&nbsp;&nbsp;호</td><td>${cCo}</td><td class="lbl" style="width:17mm">대&nbsp;&nbsp;&nbsp;표</td><td>${cCeo}</td></tr>
        <tr><td class="lbl">주&nbsp;&nbsp;&nbsp;소</td><td colspan="3">${cAddr}</td></tr>
        <tr><td class="lbl">사업자번호</td><td colspan="3">${cBiz}</td></tr>
      </table>
    </div>`:''}

    <div class="q-total-bar">
      <div class="q-total-lbl">합&nbsp;계&nbsp;금&nbsp;액<small>(공급가액+세액)</small></div>
      <div class="q-total-val">₩&nbsp;${fmt(grand)}&nbsp;원정</div>
    </div>

    <table class="q-table">
      <thead><tr>
        <th style="width:28%">품&nbsp;&nbsp;&nbsp;목</th>
        <th style="width:10%">규격</th>
        <th style="width:8%">수량</th>
        <th style="width:13%">단가</th>
        <th style="width:17%">공급가액</th>
        <th style="width:12%">세액</th>
        <th style="width:12%">비고</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td class="td-left">${r.name||''}</td>
          <td>${r.spec||''}</td>
          <td>${r.qty||''}</td>
          <td>${r.price?fmt(r.price):''}</td>
          <td>${r.supply?fmt(r.supply):''}</td>
          <td>${r.tax?fmt(r.tax):''}</td>
          <td>${r.note||''}</td>
        </tr>`).join('')}
        ${Array(empty).fill(`<tr><td class="td-left">&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}
        <tr class="sum-row">
          <td colspan="4" style="text-align:center">합&nbsp;&nbsp;계</td>
          <td>${totSupply?fmt(totSupply):''}</td>
          <td>${totTax?fmt(totTax):''}</td>
          <td></td>
        </tr>
      </tbody>
    </table>

    <div class="q-note-section">
      <div class="q-note-head">비 고 / 안내사항</div>
      <div class="q-note-body">${note?note.replace(/</g,'&lt;').replace(/\n/g,'<br>'):'&nbsp;'}</div>
    </div>

    <div class="q-footer">
      <div class="q-sign-box"><div class="sign-label">담당자 확인</div><div class="sign-line">(서명 또는 날인)</div></div>
      <div class="q-sign-box"><div class="sign-label">대 표 (을)</div><div class="sign-line">${SUP.ceo} (인)</div></div>
    </div>
  `;
}

function resetForm() {
  if (!confirm('초기화하시겠습니까?')) return;
  ['quoteNo','quoteDate','clientName','clientCompany','clientAddr','clientCeo','clientBizNo','noteText'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('quoteDate').value = new Date().toISOString().split('T')[0];
  items = [{ name:'', spec:'', qty:1, price:0, taxRate:10, note:'' }];
  renderEditor(); render();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('quoteDate').value = new Date().toISOString().split('T')[0];
  renderEditor(); render();
});
</script>
</body>
</html>
